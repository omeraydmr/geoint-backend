# STRATYON Backend - Production Configuration
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: stratyon-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stratyon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-stratyon_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stratyon-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stratyon}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: stratyon-redis
    volumes:
      - redis_data:/data
    networks:
      - stratyon-network
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 300M

  backend:
    # Use pre-built image from ECR (tagged as stratyon-backend:latest by CI/CD)
    # Falls back to local build if no pre-built image exists
    image: stratyon-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stratyon-backend
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - DEBUG=false
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stratyon-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  postgres_data:
  redis_data:

networks:
  stratyon-network:
    driver: bridge
